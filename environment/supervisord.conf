[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:rack-console]
command=python3 /opt/services/services/rack_console.py
environment=CLUSTER_DB_PATH="/var/lib/cluster-ops/cluster.db",SIM_ENGINE_BIN="/opt/services/engine/sim_engine",PORTAL_PORT="8081"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/rack_console.log
stderr_logfile=/var/log/supervisor/rack_console.err.log

[program:team-desk]
command=python3 /opt/services/services/team_desk.py
environment=CLUSTER_DB_PATH="/var/lib/cluster-ops/cluster.db",SIM_ENGINE_BIN="/opt/services/engine/sim_engine",PORTAL_PORT="8082"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/team_desk.log
stderr_logfile=/var/log/supervisor/team_desk.err.log

[program:finops-cab]
command=python3 /opt/services/services/finops_cab.py
environment=CLUSTER_DB_PATH="/var/lib/cluster-ops/cluster.db",SIM_ENGINE_BIN="/opt/services/engine/sim_engine",PORTAL_PORT="8083"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/finops_cab.log
stderr_logfile=/var/log/supervisor/finops_cab.err.log

[program:chromium]
command=sh -c 'exec "$(ls -d /opt/ms-playwright/chromium-*/chrome-linux/chrome | head -1)" --headless --no-sandbox --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --disable-gpu --disable-dev-shm-usage --no-first-run --disable-background-networking --user-data-dir=/tmp/chromium-cdp'
user=agent
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err.log
