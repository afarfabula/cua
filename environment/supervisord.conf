[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mailpit]
command=/opt/bin/mailpit --database /var/lib/mailpit/mailpit.db --smtp 0.0.0.0:1025 --listen 0.0.0.0:8025 --smtp-auth-accept-any --smtp-auth-allow-insecure --disable-version-check
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mailpit.log
stderr_logfile=/var/log/supervisor/mailpit.err.log

[program:gitea]
command=/opt/bin/gitea web --config /etc/gitea/app.ini
environment=GITEA_WORK_DIR="/var/lib/gitea",HOME="/var/lib/gitea",USER="gitea"
user=gitea
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/gitea.log
stderr_logfile=/var/log/supervisor/gitea.err.log

[program:prometheus]
command=/opt/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/data --storage.tsdb.retention.time=3650d --web.listen-address=0.0.0.0:9090
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/prometheus.log
stderr_logfile=/var/log/supervisor/prometheus.err.log

[program:grafana]
command=/opt/grafana/usr/share/grafana/bin/grafana server --homepath=/opt/grafana/usr/share/grafana --config=/etc/grafana/grafana.ini
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana.err.log

[program:perfetto]
command=python3 /opt/services/perfetto_server.py
environment=PERFETTO_UI_DIR="/opt/perfetto-ui",TRACE_DIR="/workspace/traces",PERFETTO_PORT="9001"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/perfetto.log
stderr_logfile=/var/log/supervisor/perfetto.err.log

[program:portal]
command=python3 /opt/services/portal/app.py
environment=PORTAL_DB_PATH="/var/lib/clearing-portal/portal.db",PORTAL_PORT="8080",GITEA_URL="http://127.0.0.1:3001",TRACE_DIR="/workspace/traces"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/portal.log
stderr_logfile=/var/log/supervisor/portal.err.log
