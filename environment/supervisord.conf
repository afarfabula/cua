[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mailpit]
command=/opt/bin/mailpit --database /var/lib/mailpit/mailpit.db --smtp 0.0.0.0:1025 --listen 0.0.0.0:8025 --smtp-auth-accept-any --smtp-auth-allow-insecure --disable-version-check
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mailpit.log
stderr_logfile=/var/log/supervisor/mailpit.err.log

[program:gitea]
command=/opt/bin/gitea web --config /etc/gitea/app.ini
environment=GITEA_WORK_DIR="/var/lib/gitea",HOME="/var/lib/gitea",USER="gitea"
user=gitea
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/gitea.log
stderr_logfile=/var/log/supervisor/gitea.err.log

[program:prometheus]
command=/opt/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/data --storage.tsdb.retention.time=3650d --web.listen-address=127.0.0.1:19090
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/prometheus.log
stderr_logfile=/var/log/supervisor/prometheus.err.log

[program:grafana]
command=/opt/grafana/usr/share/grafana/bin/grafana server --homepath=/opt/grafana/usr/share/grafana --config=/etc/grafana/grafana.ini --packaging=deb cfg:default.paths.data=/var/lib/grafana/data cfg:default.paths.logs=/var/log/grafana cfg:server.http_port=13000 cfg:server.http_addr=127.0.0.1
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana.err.log

[program:perfetto]
command=python3 /opt/services/perfetto_server.py
environment=PERFETTO_UI_DIR="/opt/perfetto-ui",TRACE_DIR="/opt/services/traces",PERFETTO_PORT="19001"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/perfetto.log
stderr_logfile=/var/log/supervisor/perfetto.err.log

[program:uid-proxy]
command=python3 /opt/services/uid_proxy.py
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/uid-proxy.log
stderr_logfile=/var/log/supervisor/uid-proxy.err.log

[program:portal]
command=python3 /opt/services/portal/app.py
environment=PORTAL_DB_PATH="/var/lib/clearing-portal/portal.db",PORTAL_PORT="8080",GITEA_URL="http://127.0.0.1:3001",TRACE_DIR="/opt/services/traces"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/portal.log
stderr_logfile=/var/log/supervisor/portal.err.log

[program:chromium]
command=sh -c 'exec "$(ls -d /opt/ms-playwright/chromium-*/chrome-linux/chrome | head -1)" --headless --no-sandbox --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --disable-gpu --disable-dev-shm-usage --no-first-run --disable-background-networking --user-data-dir=/tmp/chromium-cdp'
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err.log
